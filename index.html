<!DOCTYPE html>
<html>
<body>

<h2>Pagina attiva</h2>

<script>

const CANALE = "gabriele-telefono-739281-xp";

let eventi = [];

let visibileDa = null;


document.addEventListener("visibilitychange", () => {

    if (document.visibilityState === "visible") {

        visibileDa = Date.now();

    } else {

        if (visibileDa) {

            let durata = Date.now() - visibileDa;

            if (durata >= 500) {

                eventi.push({
                    ora: new Date().toLocaleString(),
                    durata: durata + " ms"
                });

            }

        }
    }

});


// ogni 15 secondi manda il rapporto

setInterval(() => {


if(eventi.length > 0){


let messaggio =
"🚨 REPORT TELEFONO\n\n";


eventi.forEach(e => {

messaggio +=
"⏰ " + e.ora +
"\nDurata: " + e.durata +
"\n\n";

});


fetch(
"https://ntfy.sh/" + CANALE,
{
method:"POST",
body:messaggio,
headers:{
"Title":"Telefono usato",
"Priority":"high"
}
});


eventi = [];


}


},15000);


</script>

</body>
</html>
